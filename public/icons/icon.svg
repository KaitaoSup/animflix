<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="50%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a38"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#990008"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Arrière-plan arrondi -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Contour subtil néon rouge -->
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="url(#redGrad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Halo d'ambiance rouge centré -->
  <circle cx="256" cy="270" r="170" fill="url(#redGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Groupe Popcorn & Cinéma -->
  <g filter="url(#dropShadow)">
    <!-- Popcorn Kernels (Grains de maïs éclatés dorés) -->
    <!-- Fond grains sombres -->
    <circle cx="210" cy="180" r="38" fill="#d97706"/>
    <circle cx="260" cy="165" r="42" fill="#d97706"/>
    <circle cx="305" cy="180" r="38" fill="#d97706"/>
    
    <!-- Grains dorés principaux -->
    <circle cx="190" cy="195" r="34" fill="url(#goldGrad)"/>
    <circle cx="230" cy="175" r="36" fill="#fef08a"/>
    <circle cx="275" cy="170" r="38" fill="#fef08a"/>
    <circle cx="320" cy="195" r="34" fill="url(#goldGrad)"/>
    <circle cx="256" cy="195" r="40" fill="url(#goldGrad)"/>

    <!-- Petit grain flottant -->
    <circle cx="165" cy="155" r="18" fill="url(#goldGrad)"/>
    <circle cx="345" cy="150" r="20" fill="url(#goldGrad)"/>
    <circle cx="256" cy="125" r="22" fill="url(#goldGrad)"/>

    <!-- Seau de Popcorn Trapézoïdal -->
    <!-- Forme du seau -->
    <path d="M 165 210 L 190 395 C 192 408, 203 418, 216 418 L 296 418 C 309 418, 320 408, 322 395 L 347 210 Z" fill="#ffffff"/>

    <!-- Rayures rouges Animflix -->
    <!-- Rayure 1 (Gauche) -->
    <path d="M 188 210 L 205 395 C 205 400, 207 404, 210 408 L 228 413 L 217 210 Z" fill="url(#redGrad)"/>
    <!-- Rayure 2 (Centre) -->
    <path d="M 243 210 L 246 418 L 266 418 L 269 210 Z" fill="url(#redGrad)"/>
    <!-- Rayure 3 (Droite) -->
    <path d="M 295 210 L 284 413 L 302 408 C 305 404, 307 400, 307 395 L 324 210 Z" fill="url(#redGrad)"/>

    <!-- Rebord supérieur du seau -->
    <rect x="156" y="202" width="200" height="14" rx="7" fill="#ffffff"/>
    <rect x="158" y="204" width="196" height="10" rx="5" fill="#f8fafc"/>

    <!-- Badge central Play rouge & or -->
    <circle cx="256" cy="305" r="46" fill="#141414" stroke="url(#redGrad)" stroke-width="4"/>
    <circle cx="256" cy="305" r="40" fill="url(#redGrad)"/>
    
    <!-- Triangle Play blanc éclatant -->
    <polygon points="246,285 276,305 246,325" fill="#ffffff"/>
  </g>

  <!-- Texte discret en bas -->
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#e50914" text-anchor="middle">ANIMFLIX</text>
</svg>
